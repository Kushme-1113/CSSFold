<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Set 2 - Q3</title>
    <style>
        /* Outer div styling & font-size set to 25px */
        #outer {
            font-size: 25px;
            background-color: lightgray;
            padding: 20px;
            border: 2px solid black;
        }

        /* Inner div styling & font-size set to 10px */
        #inner {
            font-size: 10px;
            background-color: lightblue;
            padding: 10px;
            border: 1px solid blue;
        }
    </style>
</head>
<body>
    <!-- Outer Div -->
    <div id="outer">
        Outer Div Text (Size: 25px)
        
        <!-- Inner Div nested inside Outer Div -->
        <div id="inner">
            Inner Div Text (Size: 10px)
        </div>
    </div>
</body>
</html>
