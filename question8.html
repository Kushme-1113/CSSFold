<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Set 3 - Q2 (Amazon Navbar)</title>
    <style>
        /* Navbar container styling based on notes specs */
        .navbar {
            background-color: #0f1111; /* Dark background */
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 15px;
        }

        /* Navbar links styling */
        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        /* Amazon Logo styling */
        .logo {
            color: #f08804;
            font-weight: bold;
            font-size: 22px;
        }

        /* Search input and button styling */
        .search-container input {
            padding: 6px;
            width: 200px;
            border: none;
            border-radius: 2px 0 0 2px;
        }

        .search-container button {
            background-color: #f08804; /* Yellow color from specs */
            color: black;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 0 2px 2px 0;
        }
    </style>
</head>
<body>
    <h1>Practice Set 3 - Question 2</h1>

    <!-- Amazon Navbar Structure -->
    <div class="navbar">
        <a href="#" class="logo">amazon.in</a>
        <a href="#">Account</a>
        <a href="#">My Cart</a>
        <a href="#">Contact Us</a>
        
        <div class="search-container">
            <input type="text" placeholder="search Amazon.in">
            <button>Search</button>
        </div>
    </div>
</body>
</html>
