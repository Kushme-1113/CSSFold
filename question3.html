<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Set 1 - Q3</title>
    
    <!-- Method 2: Blue background using <style> tag -->
    <style>
        .blue-btn {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            margin: 10px;
        }
        
        /* Method 1: Green background using CSS stylesheet rule */
        .green-btn {
            background-color: green;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>Practice Set 1 - Question 3</h1>

    <!-- Button 1: Green using stylesheet rule -->
    <button class="green-btn">Green Button (Stylesheet)</button>

    <!-- Button 2: Blue using <style> tag -->
    <button class="blue-btn">Blue Button (&lt;style&gt; tag)</button>

    <!-- Button 3: Pink using inline style -->
    <button style="background-color: pink; color: black; padding: 10px 20px; font-size: 16px; border: none; cursor: pointer; margin: 10px;">
        Pink Button (Inline style)
    </button>
</body>
</html>
